; ControLab firmware — modules ESP32
; Focus de développement actuel : ESP32-S3 (variantes s3_full / s3_compact / s3_noscreen)
; Les environnements c3/c6 sont des placeholders : même code source, seul
; board_config.h doit être complété (voir firmware/boards/esp32c3|esp32c6/README.md)

[platformio]
default_envs = s3_full
src_dir = src
include_dir = include

[env]
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps =
    ; 1.4.x plante au démarrage du contrôleur BT sur Arduino-ESP32 3.x
    ; (conflits de config CONFIG_BT_NIMBLE_* avec les sdkconfig.h prébuilts
    ; du core, crash LoadProhibited dans btdm_controller_init). La 2.x est la
    ; ligne maintenue pour ces cores récents.
    h2zero/NimBLE-Arduino @ ^2.5.1
    bblanchon/ArduinoJson @ ^7.0.4
    adafruit/Adafruit PN532 @ ^1.3.3
build_flags =
    -D CORE_DEBUG_LEVEL=3

; ---------------------------------------------------------------------------
; ESP32-S3 — variante "full" : écran (actuellement devboard Waveshare
; ESP32-S3-RLCD-4.2, écran ST7305 en SPI). NFC et anneau de LEDs désactivés
; pour l'instant (board_config.h) tant qu'ils ne sont pas câblés.
; ---------------------------------------------------------------------------
[env:s3_full]
platform = espressif32
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -D VARIANT_S3_FULL
lib_deps =
    ${env.lib_deps}
    ; Le support ST7305 (issue olikraus/u8g2#2661) est arrivé avec la 2.36.18 ;
    ; ne pas descendre en dessous.
    olikraus/U8g2 @ ^2.36.18

; ---------------------------------------------------------------------------
; ESP32-S3 — variante "compact" : pas d'écran, une seule LED statut, secteur
; ---------------------------------------------------------------------------
[env:s3_compact]
platform = espressif32
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -D VARIANT_S3_COMPACT

; ---------------------------------------------------------------------------
; ESP32-S3 — variante "noscreen" : anneau de LEDs + batterie, sans écran
; ---------------------------------------------------------------------------
[env:s3_noscreen]
platform = espressif32
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -D VARIANT_S3_NOSCREEN
lib_deps =
    ${env.lib_deps}
    adafruit/Adafruit NeoPixel @ ^1.12.3

